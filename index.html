<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#071426">
    <title>SchoolHub - O'quvchilar Ijtimoiy Tarmog'i</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #071426;
            --panel: rgba(16,39,66,.92);
            --gold: #f4ce70;
            --text: #f4f7ff;
            --muted: #b7c7dd;
            --border: rgba(244,206,112,.3);
        }
        body {
            margin: 0; min-height: 100vh; color: var(--text);
            font-family: system-ui, Arial, sans-serif;
            background: radial-gradient(ellipse at 10% 10%,#173b60,transparent 45%),
                        linear-gradient(145deg,#050d19,#0a1b31 55%,#071426);
            background-attachment: fixed;
        }
        .bg-slider {
            transition: background-image 1.2s ease-in-out;
            background-size: cover;
            background-position: center;
        }
        .glass {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
        }
        .flip-card { cursor: pointer; transition: transform 0.3s; }
        .flip-card:active { transform: scale(0.97); }
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen font-sans">

    <!-- 1. RO'YXATDAN O'TISH / KIRISH MODAL OYNASI -->
    <div id="authScreen" class="bg-slider fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="glass p-8 rounded-3xl shadow-2xl w-full max-w-md">
            <div class="text-center mb-6">
                <h1 class="text-3xl font-extrabold text-amber-400"><i class="fa-solid fa-graduation-cap"></i> SchoolHub</h1>
                <p id="authSubtitle" class="text-sm text-gray-300 mt-1">Maktab o'quvchilari uchun maxsus platforma</p>
            </div>

            <div class="space-y-4">
                <div id="usernameField" class="hidden">
                    <label class="text-xs text-gray-300">Takrorlanmas Username</label>
                    <div class="flex items-center bg-slate-800/80 rounded-xl px-3 py-2 mt-1 border border-slate-600">
                        <span class="text-amber-400 font-bold mr-1">@</span>
                        <input id="usernameInput" type="text" placeholder="masalan: sardor_07" class="bg-transparent w-full focus:outline-none text-sm text-white">
                    </div>
                </div>
                <div>
                    <label class="text-xs text-gray-300">Email manzilingiz</label>
                    <input id="emailInput" type="email" placeholder="oquvchi@gmail.com" class="w-full bg-slate-800/80 rounded-xl px-3 py-2 mt-1 border border-slate-600 focus:outline-none text-sm text-white">
                </div>
                <div>
                    <label class="text-xs text-gray-300">Parol</label>
                    <input id="passwordInput" type="password" placeholder="••••••••" class="w-full bg-slate-800/80 rounded-xl px-3 py-2 mt-1 border border-slate-600 focus:outline-none text-sm text-white">
                </div>
                
                <button id="authSubmitBtn" onclick="handleAuth()" class="w-full bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-600 hover:to-yellow-700 text-slate-950 font-extrabold py-3 rounded-xl shadow-lg transition">
                    Kirish
                </button>
                
                <button onclick="toggleAuthMode()" id="switchAuthBtn" class="w-full bg-slate-800 hover:bg-slate-700 text-gray-300 font-bold py-2.5 rounded-xl text-sm transition">
                    Akkauntingiz yo'qmi? Ro'yxatdan o'tish
                </button>
                <p id="authMessage" class="text-xs text-center text-amber-300 mt-2"></p>
            </div>
        </div>
    </div>

    <!-- 2. ASOSIY PLATFORM (Kirgandan keyin ochiladi) -->
    <div id="mainApp" class="hidden min-h-screen flex flex-col">
        <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex justify-between items-center sticky top-0 z-40">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-graduation-cap text-amber-400 text-2xl"></i>
                <span class="font-bold text-lg text-amber-400">SchoolHub</span>
            </div>
            <div class="flex items-center space-x-3">
                <div class="bg-amber-500/20 border border-amber-400 text-amber-300 px-3 py-1 rounded-full text-sm font-bold flex items-center gap-1">
                    <i class="fa-solid fa-coins"></i> <span id="tokenCount">35</span> Token
                </div>
                <div id="userBadge" class="
