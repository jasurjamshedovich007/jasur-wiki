
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <title>Jasur Wiki</title>
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: #101010;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 30px 18px;
      text-align: center;
      background: #171717;
      border-bottom: 1px solid #333;
    }
    header h1 {
      margin: 0;
      color: #ffd600;
      font-size: clamp(30px, 6vw, 48px);
    }
    header p { color: #bbb; }
    nav {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      background: #111;
      border-bottom: 1px solid #333;
    }
    nav button, .back {
      border: 1px solid #444;
      border-radius: 9px;
      padding: 11px 15px;
      background: #222;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    nav button.active, nav button:hover,
    .back:hover {
      background: #ffd600;
      color: #111;
    }
    main {
      width: min(900px, 100%);
      margin: auto;
      padding: 20px 16px 50px;
    }
    .intro, .article, .entry {
      background: #191919;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 20px;
      margin: 16px 0;
    }
    h2, .entry h3 { color: #ffd600; }
    .entry {
      display: block;
      width: 100%;
      text-align: left;
      color: white;
      cursor: pointer;
      font: inherit;
    }
    .entry h3 { margin: 0 0 8px; }
    .entry p, .muted { color: #bbb; line-height: 1.7; }
    .entry:hover { border-color: #ffd600; }
    .article { line-height: 1.8; overflow-wrap: anywhere; }
    .article img {
      display: block;
      width: 100%;
      max-height: 500px;
      object-fit: contain;
      border-radius: 12px;
      margin: 20px 0;
      background: #222;
    }
    .article-body { white-space: pre-wrap; }
    .hidden { display: none !important; }
    #status { color: #ffd600; line-height: 1.6; }
    footer {
      text-align: center;
      padding: 24px;
      color: #888;
      border-top: 1px solid #333;
    }
  </style>
</head>
<body>
<header>
  <h1>JASUR WIKI</h1>
  <p>Shaxsiy ensiklopediya · G‘oyalar · Loyihalar</p>
</header>

<nav aria-label="Asosiy menyu">
  <button class="active" data-section="bio">Bio</button>
  <button data-section="yutuqlar">Yutuqlar</button>
  <button data-section="loyihalar">Loyihalar</button>
  <button data-section="yangiliklar">Yangiliklar</button>
</nav>

<main>
  <section id="home">
    <div class="intro">
      <h2>Jasur Wiki’ga xush kelibsiz!</h2>
      <p class="muted">
        Bo‘limni tanlang. Maqola sarlavhasini bosib,
        uning to‘liq ma’lumotini o‘qing.
      </p>
    </div>
    <p id="status">Ma’lumotlar yuklanmoqda...</p>
    <div id="list"></div>
  </section>

  <article id="detail" class="article hidden">
    <button class="back" id="backBtn">← Orqaga</button>
    <h2 id="detailTitle"></h2>
    <img id="detailImage" class="hidden" alt="">
    <div id="detailContent" class="article-body"></div>
  </article>
</main>

<footer>© Jasur Wiki</footer>

<script type="module">
  import { createClient } from
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL =
    'https://nbbpengewjhbvcburydh.supabase.co';

  const SUPABASE_KEY =
    'sb_publishable_kqXaCVM316G1CppA6_W0JQ_KHWpwrXm';

  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  const labels = {
    bio: 'Bio',
    yutuqlar: 'Yutuqlar',
    loyihalar: 'Loyihalar',
    yangiliklar: 'Yangiliklar'
  };

  const $ = id => document.getElementById(id);
  let allItems = [];
  let currentSection = 'bio';

  function make(tag, className, text) {
    const el = document.createElement(tag);
    if (className) el.className = className;
    if (text !== undefined) el.textContent = text;
    return el;
  }

  function showList() {
    $('detail').classList.add('hidden');
    $('home').classList.remove('hidden');
  }

  function showArticle(item) {
    $('home').classList.add('hidden');
    $('detail').classList.remove('hidden');

    $('detailTitle').textContent = item.title || '';
    $('detailContent').textContent = item.content || '';

    const img = $('detailImage');
    img.classList.add('hidden');
    img.removeAttribute('src');

    if (item.image_url) {
      try {
        const url = new URL(item.image_url);
        if (url.protocol === 'https:') {
          img.src = url.href;
          img.alt = item.title || 'Maqola rasmi';
          img.classList.remove('hidden');
          img.onerror = () => img.classList.add('hidden');
        }
      } catch {}
    }

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderList() {
    const list = $('list');
    list.replaceChildren();

    const items = allItems.filter(
      item => item.section === currentSection
    );

    $('status').textContent = items.length
      ? labels[currentSection] + ': ' + items.length + ' ta maqola'
      : labels[currentSection] +
        ' bo‘limida hali maqola yo‘q. Admin paneldan qo‘shish mumkin.';

    items.forEach(item => {
      const button = make('button', 'entry');
      button.type = 'button';

      button.append(
        make('h3', '', item.title || 'Sarlavhasiz'),
        make('p', '', 'To‘liq ma’lumotni o‘qish →')
      );

      button.addEventListener('click', () => showArticle(item));
      list.append(button);
    });
  }

  document.querySelectorAll('nav button').forEach(button => {
    button.addEventListener('click', () => {
      currentSection = button.dataset.section;

      document.querySelectorAll('nav button').forEach(btn => {
        btn.classList.toggle('active', btn === button);
      });

      showList();
      renderList();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  $('backBtn').addEventListener('click', () => {
    showList();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  async function loadContent() {
    try {
      const { data, error } = await supabase
        .from('wiki_content')
        .select('id, section, title, content, image_url, created_at')
        .order('created_at', { ascending: false });

      if (error) throw error;

      allItems = data || [];
      renderList();
    } catch (error) {
      $('status').textContent =
        'Ma’lumotlarni yuklashda xato: ' + error.message;
    }
  }

  loadContent();
</script>
</body>
</html>
