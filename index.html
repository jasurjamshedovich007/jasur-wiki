
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071426">
<title>Jasur Wiki</title>

<style>
:root {
  --bg:#071426;
  --panel:rgba(16,39,66,.92);
  --gold:#f4ce70;
  --text:#f4f7ff;
  --muted:#b7c7dd;
  --border:rgba(244,206,112,.3);
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:system-ui,Arial,sans-serif;
  background:radial-gradient(ellipse at 10% 10%,#173b60,transparent 45%),
  linear-gradient(145deg,#050d19,#0a1b31 55%,#071426);
  background-attachment:fixed;
}
header{text-align:center;padding:35px 15px 25px;border-bottom:1px solid var(--border)}
header h1{margin:0;color:var(--gold);font-size:clamp(34px,7vw,54px);letter-spacing:3px}
header p{color:var(--muted)}
nav{
  position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;
  justify-content:center;gap:8px;padding:12px 8px;
  background:rgba(5,15,28,.96);border-bottom:1px solid var(--border);
}
button,input{font:inherit}
button{
  cursor:pointer;transition:.2s;
  -webkit-tap-highlight-color:transparent;
}
nav button,.action,.back{
  padding:11px 15px;border:1px solid var(--border);
  border-radius:11px;background:#142d49;color:var(--text);
  font-weight:700;
}
nav button:hover,.action:hover,.back:hover{border-color:var(--gold);transform:translateY(-1px)}
nav button.active{background:var(--gold);color:#142033}
nav .auth-button{border-color:var(--gold);color:var(--gold)}
nav .auth-button.primary{background:var(--gold);color:#142033}
main{width:min(920px,100%);margin:auto;padding:24px 15px 50px;min-height:55vh}
.intro,.article,.entry{
  background:var(--panel);border:1px solid rgba(164,194,229,.17);
  border-radius:17px;box-shadow:0 10px 30px #0002;
}
.intro{padding:22px;margin-bottom:20px}
h2,.entry h3{color:var(--gold)}
.muted,.entry p{color:var(--muted);line-height:1.8}
#status{color:var(--gold);line-height:1.7;font-size:14px}
#list{display:grid;gap:13px}
.entry{display:block;width:100%;text-align:left;padding:18px;color:var(--text)}
.entry h3{margin:0 0 8px}
.entry p{margin:0}
.article{padding:22px;line-height:1.8;overflow-wrap:anywhere}
.article img{width:100%;max-height:450px;object-fit:contain;border-radius:12px;margin:15px 0}
.article-body{white-space:pre-wrap}
.back{margin-bottom:10px}
.hidden{display:none!important}
footer{text-align:center;padding:25px;color:#9aabc2;font-size:13px;border-top:1px solid var(--border)}
/* Kirish va ro'yxatdan o'tish oynasi */
.modal{
  position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.78);
  display:flex;align-items:center;justify-content:center;
  padding:16px;overflow-y:auto;
}
.modal-card{
  width:min(430px,100%);padding:23px;border:1px solid var(--border);
  border-radius:18px;background:#0b1b30;box-shadow:0 20px 70px #0008;
}
.modal-card h2{margin-top:0}
.field{display:grid;gap:6px;margin:13px 0}
.field label{font-size:14px;color:var(--muted)}
.field input{
  width:100%;padding:12px;border-radius:10px;
  border:1px solid #39516d;background:#071426;color:white;
}
.field input:focus{outline:2px solid var(--gold)}
.action{width:100%;margin-top:9px}
.action.primary{background:var(--gold);color:#142033;border-color:var(--gold)}
.modal-tools{display:flex;gap:8px;margin-top:12px}
.modal-tools button{flex:1;padding:10px;border:1px solid var(--border);border-radius:9px;background:#142d49;color:white}
#authMessage{font-size:14px;line-height:1.6;color:var(--gold);overflow-wrap:anywhere}
#accountInfo{font-size:13px;color:var(--muted);max-width:100%;overflow-wrap:anywhere}
@media(max-width:520px){
  nav{gap:6px}
  nav button{padding:9px 10px;font-size:13px}
  main{padding:17px 11px 35px}
  .intro,.article{padding:17px}
}
</style>
</head>

<body>
<header>
  <h1>JASUR WIKI</h1>
  <p>Shaxsiy ensiklopediya · G‘oyalar · Loyihalar</p>
</header>

<nav aria-label="Asosiy menyu">
  <button class="active" data-section="bio">Bio</button>
  <button data-section="yutuqlar">Yutuqlar</button>
  <button data-section="loyihalar">Loyihalar</button>
  <button data-section="yangiliklar">Yangiliklar</button>
  <button class="auth-button primary" id="loginBtn">Kirish</button>
  <button class="auth-button" id="registerBtn">Ro‘yxatdan o‘tish</button>
  <button class="auth-button hidden" id="logoutBtn">Chiqish</button>
</nav>

<main>
  <div id="accountInfo" class="hidden"></div>

  <section id="home">
    <div class="intro">
      <h2>Jasur Wiki’ga xush kelibsiz!</h2>
      <p class="muted">Bo‘limni tanlang. Maqola sarlavhasini bosib, to‘liq ma’lumotni o‘qing.</p>
    </div>
    <p id="status">Ma’lumotlar yuklanmoqda...</p>
    <div id="list"></div>
  </section>

  <article id="detail" class="article hidden">
    <button class="back" id="backBtn">← Orqaga</button>
    <h2 id="detailTitle"></h2>
    <img id="detailImage" class="hidden" alt="">
    <div id="detailContent" class="article-body"></div>
  </article>
</main>

<!-- Kirish / ro'yxatdan o'tish oynasi -->
<div id="authModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="authTitle">
  <div class="modal-card">
    <h2 id="authTitle">Jasur Wiki</h2>
    <p id="authDescription" class="muted">Akkauntingizga kiring.</p>

    <form id="authForm">
      <div id="nameFields" class="hidden">
        <div class="field">
          <label for="displayName">Ism</label>
          <input id="displayName" type="text" maxlength="60" autocomplete="name" placeholder="Ismingiz">
        </div>
        <div class="field">
          <label for="username">Foydalanuvchi nomi</label>
          <input id="username" type="text" maxlength="30" autocomplete="username" placeholder="Masalan, jasur123">
        </div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required placeholder="email@example.com">
      </div>

      <div class="field">
        <label for="password">Parol (kamida 6 ta belgi)</label>
        <input id="password" type="password" minlength="6" autocomplete="current-password" required placeholder="Parolingiz">
      </div>

      <button class="action primary" id="submitAuth" type="submit">Kirish</button>
    </form>

    <p id="authMessage" role="status" aria-live="polite"></p>

    <div class="modal-tools">
      <button type="button" id="switchAuth">Ro‘yxatdan o‘tish</button>
      <button type="button" id="closeAuth">Yopish</button>
    </div>
  </div>
</div>

<footer>© Jasur Wiki · Barcha huquqlar himoyalangan</footer>

<script type="module">
import { createClient } from
  'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://nbbpengewjhbvcburydh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_kqXaCVM316G1CppA6_W0JQ_KHWpwrXm';
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);

const labels = {
  bio:'Bio',
  yutuqlar:'Yutuqlar',
  loyihalar:'Loyihalar',
  yangiliklar:'Yangiliklar'
};

let allItems = [];
let currentSection = 'bio';
let authMode = 'login';

function make(tag, className, text) {
  const el = document.createElement(tag);
  if (className) el.className = className;
  if (text !== undefined) el.textContent = text;
  return el;
}

function showList() {
  $('detail').classList.add('hidden');
  $('home').classList.remove('hidden');
}

function showArticle(item) {
  $('home').classList.add('hidden');
  $('detail').classList.remove('hidden');
  $('detailTitle').textContent = item.title || '';
  $('detailContent').textContent = item.content || '';

  const img = $('detailImage');
  img.classList.add('hidden');
  img.removeAttribute('src');

  if (item.image_url) {
    try {
      const url = new URL(item.image_url);
      if (url.protocol === 'https:') {
        img.src = url.href;
        img.alt = item.title || 'Maqola rasmi';
        img.classList.remove('hidden');
        img.onerror = () => img.classList.add('hidden');
      }
    } catch {}
  }
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderList() {
  const list = $('list');
  list.replaceChildren();

  const items = allItems.filter(item => item.section === currentSection);

  $('status').textContent = items.length
    ? labels[currentSection] + ': ' + items.length + ' ta maqola'
    : labels[currentSection] + ' bo‘limida hozircha maqola yo‘q.';

  items.forEach(item => {
    const button = make('button','entry');
    button.type = 'button';
    button.append(
      make('h3','',item.title || 'Sarlavhasiz'),
      make('p','','To‘liq ma’lumotni o‘qish →')
    );
    button.addEventListener('click',() => showArticle(item));
    list.append(button);
  });
}

document.querySelectorAll('nav button[data-section]').forEach(button => {
  button.addEventListener('click',() => {
    currentSection = button.dataset.section;
    document.querySelectorAll('nav button[data-section]').forEach(btn => {
      btn.classList.toggle('active',btn === button);
    });
    showList();
    renderList();
    window.scrollTo({top:0,behavior:'smooth'});
  });
});

$('backBtn').addEventListener('click',() => {
  showList();
  window.scrollTo({top:0,behavior:'smooth'});
});

async function loadContent() {
  try {
    const {data,error} = await supabase
      .from('wiki_content')
      .select('id, section, title, content, image_url, created_at')
      .order('created_at',{ascending:false});

    if (error) throw error;
    allItems = data || [];
    renderList();
  } catch (error) {
    $('status').textContent = 'Ma’lumotlarni yuklashda xato: ' + error.message;
  }
}

/* Auth oynasi */
function openAuth(mode) {
  authMode = mode;
  $('authModal').classList.remove('hidden');
  $('authMessage').textContent = '';
  $('authTitle').textContent = mode === 'login' ? 'Akkauntga kirish' : 'Yangi akkaunt';
  $('authDescription').textContent = mode === 'login'
    ? 'Email va parolingizni kiriting.'
    : 'Jasur Wiki uchun akkaunt yarating.';
  $('nameFields').classList.toggle('hidden',mode !== 'register');
  $('submitAuth').textContent = mode === 'login' ? 'Kirish' : 'Ro‘yxatdan o‘tish';
  $('switchAuth').textContent = mode === 'login'
    ? 'Ro‘yxatdan o‘tish'
    : 'Kirish';
  $('password').autocomplete = mode === 'login' ? 'current-password' : 'new-password';
}

$('loginBtn').addEventListener('click',() => openAuth('login'));
$('registerBtn').addEventListener('click',() => openAuth('register'));
$('closeAuth').addEventListener('click',() => $('authModal').classList.add('hidden'));
$('switchAuth').addEventListener('click',() => {
  openAuth(authMode === 'login' ? 'register' : 'login');
});

$('authModal').addEventListener('click',event => {
  if (event.target === $('authModal')) $('authModal').classList.add('hidden');
});

function showAccount(user) {
  const signedIn = !!user;
  $('loginBtn').classList.toggle('hidden',signedIn);
  $('registerBtn').classList.toggle('hidden',signedIn);
  $('logoutBtn').classList.toggle('hidden',!signedIn);
  $('accountInfo').classList.toggle('hidden',!signedIn);
  $('accountInfo').textContent = signedIn
    ? 'Kirdingiz: ' + (user.email || 'foydalanuvchi')
    : '';
}

$('authForm').addEventListener('submit',async event => {
  event.preventDefault();
  const email = $('email').value.trim();
  const password = $('password').value;
  const submit = $('submitAuth');

  submit.disabled = true;
  $('authMessage').textContent = 'Iltimos, kuting...';

  try {
    if (authMode === 'register') {
      const username = $('username').value.trim();
      const displayName = $('displayName').value.trim();

      if (!username || !displayName) {
        throw new Error('Ism va foydalanuvchi nomini kiriting.');
      }

      if (!/^[a-zA-Z0-9_]+$/.test(username)) {
        throw new Error('Foydalanuvchi nomida faqat lotin harflari, raqamlar va _ ishlating.');
      }

      const {data,error} = await supabase.auth.signUp({
        email,
        password,
        options:{
          data:{username,display_name:displayName}
        }
      });

      if (error) throw error;

      if (data.session) {
        $('authMessage').textContent = 'Akkaunt yaratildi!';
        $('authModal').classList.add('hidden');
      } else {
        $('authMessage').textContent =
          'Ro‘yxatdan o‘tish so‘rovi yuborildi. Emailingizga tasdiqlash xati kelgan bo‘lsa, uni ochib tasdiqlang.';
      }
    } else {
      const {error} = await supabase.auth.signInWithPassword({email,password});
      if (error) throw error;
      $('authMessage').textContent = 'Muvaffaqiyatli kirdingiz!';
      $('authModal').classList.add('hidden');
    }
  } catch (error) {
    $('authMessage').textContent = 'Xato: ' + error.message;
  } finally {
    submit.disabled = false;
  }
});

$('logoutBtn').addEventListener('click',async () => {
  const {error} = await supabase.auth.signOut();
  if (error) {
    alert('Chiqishda xato: ' + error.message);
  }
});

supabase.auth.onAuthStateChange((_event,session) => {
  showAccount(session?.user || null);
});

async function initAuth() {
  const {data,error} = await supabase.auth.getSession();
  if (error) {
    $('authMessage').textContent = 'Akkaunt holatini tekshirib bo‘lmadi.';
    return;
  }
  showAccount(data.session?.user || null);
}

initAuth();
loadContent();
</script>
</body>
</html>
