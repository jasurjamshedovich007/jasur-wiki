
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071426">
  <title>Jasur Wiki</title>

  <style>
    :root {
      --bg: #071426;
      --panel: rgba(16, 39, 66, .82);
      --gold: #f4ce70;
      --gold-light: #ffe8a6;
      --text: #f4f7ff;
      --muted: #b7c7dd;
      --border: rgba(244, 206, 112, .25);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 10% 10%,
          rgba(30, 86, 143, .32), transparent 42%),
        radial-gradient(ellipse at 90% 40%,
          rgba(151, 111, 32, .12), transparent 38%),
        linear-gradient(145deg, #050d19, #0a1b31 55%, #071426);
      background-attachment: fixed;
      color: var(--text);
      font-family: system-ui, -apple-system, Arial, sans-serif;
      overflow-x: hidden;
    }

    /* Harakatlanuvchi yorug‘lik effektlari */
    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .15;
      pointer-events: none;
      z-index: -1;
      animation: lightMove 12s ease-in-out infinite alternate;
    }

    body::before {
      background: #2583dc;
      top: 10%;
      left: -150px;
    }

    body::after {
      background: #e4ae39;
      right: -160px;
      bottom: 5%;
      animation-delay: -5s;
    }

    @keyframes lightMove {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(60px, 50px) scale(1.3); }
    }

    header {
      position: relative;
      text-align: center;
      padding: 48px 18px 38px;
      background: linear-gradient(
        135deg,
        rgba(11, 31, 54, .96),
        rgba(16, 47, 77, .78)
      );
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }

    header::after {
      content: "";
      position: absolute;
      left: 15%;
      right: 15%;
      bottom: 0;
      height: 1px;
      background: linear-gradient(
        90deg, transparent, var(--gold), transparent
      );
    }

    header h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 58px);
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--gold);
      text-shadow: 0 0 25px rgba(244, 206, 112, .2);
      animation: titleIn .8s ease both;
    }

    header p {
      color: var(--muted);
      margin: 12px 0 0;
      font-size: clamp(13px, 2.5vw, 16px);
      letter-spacing: .5px;
      animation: titleIn 1s ease both;
    }

    @keyframes titleIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      padding: 13px 12px;
      background: rgba(5, 15, 28, .88);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    nav button,
    .back {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(244, 206, 112, .32);
      border-radius: 12px;
      padding: 12px 18px;
      background: linear-gradient(
        135deg, #142d49, #0d2037
      );
      color: #e8effb;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition:
        transform .25s ease,
        color .25s ease,
        background .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;
      -webkit-tap-highlight-color: transparent;
    }

    nav button::before,
    .back::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -80%;
      width: 45%;
      height: 200%;
      background: rgba(255, 255, 255, .15);
      transform: rotate(25deg);
      transition: left .5s ease;
      pointer-events: none;
    }

    nav button:hover::before,
    .back:hover::before {
      left: 140%;
    }

    nav button:hover,
    .back:hover {
      transform: translateY(-3px);
      border-color: var(--gold);
      color: var(--gold-light);
      box-shadow: 0 7px 24px rgba(0, 0, 0, .22);
    }

    nav button:active,
    .back:active,
    .entry:active {
      transform: scale(.97);
    }

    nav button.active {
      color: #142033;
      background: linear-gradient(
        135deg, var(--gold-light), #d9aa43
      );
      border-color: var(--gold-light);
      box-shadow: 0 0 22px rgba(244, 206, 112, .2);
    }

    main {
      width: min(920px, 100%);
      margin: auto;
      padding: 26px 17px 55px;
      min-height: 55vh;
    }

    .intro,
    .article,
    .entry {
      background: var(--panel);
      border: 1px solid rgba(164, 194, 229, .15);
      border-radius: 19px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, .16);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .intro {
      position: relative;
      overflow: hidden;
      padding: 24px;
      margin: 0 0 22px;
      animation: cardIn .5s ease both;
    }

    .intro::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(
        var(--gold-light), #a97b27
      );
    }

    h2,
    .entry h3 {
      color: var(--gold);
    }

    .intro h2 {
      margin-top: 0;
      font-size: clamp(21px, 4vw, 28px);
    }

    .intro p,
    .entry p,
    .muted {
      color: var(--muted);
      line-height: 1.8;
    }

    #status {
      color: var(--gold-light);
      line-height: 1.7;
      margin: 18px 3px;
      font-size: 14px;
    }

    #list {
      display: grid;
      gap: 14px;
    }

    .entry {
      display: block;
      width: 100%;
      text-align: left;
      padding: 20px;
      color: var(--text);
      font: inherit;
      cursor: pointer;
      transition:
        transform .25s ease,
        border-color .25s ease,
        background .25s ease,
        box-shadow .25s ease;
      animation: cardIn .45s ease both;
      -webkit-tap-highlight-color: transparent;
    }

    .entry:hover {
      transform: translateY(-4px);
      border-color: rgba(244, 206, 112, .7);
      background: rgba(22, 51, 83, .95);
      box-shadow: 0 12px 30px rgba(0, 0, 0, .23);
    }

    .entry h3 {
      margin: 0 0 9px;
      font-size: 19px;
    }

    .entry p {
      margin: 0;
      font-size: 14px;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .article {
      padding: clamp(18px, 4vw, 30px);
      line-height: 1.85;
      overflow-wrap: anywhere;
      animation: cardIn .35s ease both;
    }

    .article h2 {
      font-size: clamp(23px, 4vw, 32px);
    }

    .article img {
      display: block;
      width: 100%;
      max-height: 500px;
      object-fit: contain;
      border-radius: 14px;
      margin: 22px 0;
      background: #071426;
      border: 1px solid var(--border);
    }

    .article-body {
      white-space: pre-wrap;
      color: #e0e9f6;
    }

    .back {
      margin-bottom: 12px;
    }

    .hidden {
      display: none !important;
    }

    footer {
      text-align: center;
      padding: 26px 16px;
      color: #9aabc2;
      background: rgba(4, 13, 24, .5);
      border-top: 1px solid var(--border);
      font-size: 13px;
    }

    button:focus-visible {
      outline: 2px solid var(--gold-light);
      outline-offset: 4px;
    }

    @media (max-width: 520px) {
      header {
        padding: 35px 14px 28px;
      }

      nav {
        gap: 7px;
        padding: 10px 8px;
      }

      nav button {
        padding: 10px 12px;
        font-size: 13px;
        border-radius: 10px;
      }

      main {
        padding: 19px 12px 38px;
      }

      .intro,
      .entry {
        padding: 18px;
        border-radius: 15px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
<header>
  <h1>JASUR WIKI</h1>
  <p>Shaxsiy ensiklopediya · G‘oyalar · Loyihalar</p>
</header>

<nav aria-label="Asosiy menyu">
  <button class="active" data-section="bio">Bio</button>
  <button data-section="yutuqlar">Yutuqlar</button>
  <button data-section="loyihalar">Loyihalar</button>
  <button data-section="yangiliklar">Yangiliklar</button>
</nav>

<main>
  <section id="home">
    <div class="intro">
      <h2>Jasur Wiki’ga xush kelibsiz!</h2>
      <p class="muted">
        Bo‘limni tanlang. Maqola sarlavhasini bosib,
        uning to‘liq ma’lumotini o‘qing.
      </p>
    </div>
    <p id="status">Ma’lumotlar yuklanmoqda...</p>
    <div id="list"></div>
  </section>

  <article id="detail" class="article hidden">
    <button class="back" id="backBtn">← Orqaga</button>
    <h2 id="detailTitle"></h2>
    <img id="detailImage" class="hidden" alt="">
    <div id="detailContent" class="article-body"></div>
  </article>
</main>

<footer>© Jasur Wiki · Barcha huquqlar himoyalangan</footer>

<script type="module">
  import { createClient } from
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL =
    'https://nbbpengewjhbvcburydh.supabase.co';

  const SUPABASE_KEY =
    'sb_publishable_kqXaCVM316G1CppA6_W0JQ_KHWpwrXm';

  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  const labels = {
    bio: 'Bio',
    yutuqlar: 'Yutuqlar',
    loyihalar: 'Loyihalar',
    yangiliklar: 'Yangiliklar'
  };

  const $ = id => document.getElementById(id);
  let allItems = [];
  let currentSection = 'bio';

  function make(tag, className, text) {
    const el = document.createElement(tag);
    if (className) el.className = className;
    if (text !== undefined) el.textContent = text;
    return el;
  }

  function showList() {
    $('detail').classList.add('hidden');
    $('home').classList.remove('hidden');
  }

  function showArticle(item) {
    $('home').classList.add('hidden');
    $('detail').classList.remove('hidden');

    $('detailTitle').textContent = item.title || '';
    $('detailContent').textContent = item.content || '';

    const img = $('detailImage');
    img.classList.add('hidden');
    img.removeAttribute('src');

    if (item.image_url) {
      try {
        const url = new URL(item.image_url);
        if (url.protocol === 'https:') {
          img.src = url.href;
          img.alt = item.title || 'Maqola rasmi';
          img.classList.remove('hidden');
          img.onerror = () => img.classList.add('hidden');
        }
      } catch {}
    }

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderList() {
    const list = $('list');
    list.replaceChildren();

    const items = allItems.filter(
      item => item.section === currentSection
    );

    $('status').textContent = items.length
      ? labels[currentSection] + ': ' + items.length + ' ta maqola'
      : labels[currentSection] +
        ' bo‘limida hali maqola yo‘q. Admin paneldan qo‘shish mumkin.';

    items.forEach(item => {
      const button = make('button', 'entry');
      button.type = 'button';

      button.append(
        make('h3', '', item.title || 'Sarlavhasiz'),
        make('p', '', 'To‘liq ma’lumotni o‘qish →')
      );

      button.addEventListener('click', () => showArticle(item));
      list.append(button);
    });
  }

  document.querySelectorAll('nav button').forEach(button => {
    button.addEventListener('click', () => {
      currentSection = button.dataset.section;

      document.querySelectorAll('nav button').forEach(btn => {
        btn.classList.toggle('active', btn === button);
      });

      showList();
      renderList();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  $('backBtn').addEventListener('click', () => {
    showList();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  async function loadContent() {
    try {
      const { data, error } = await supabase
        .from('wiki_content')
        .select('id, section, title, content, image_url, created_at')
        .order('created_at', { ascending: false });

      if (error) throw error;

      allItems = data || [];
      renderList();
    } catch (error) {
      $('status').textContent =
        'Ma’lumotlarni yuklashda xato: ' + error.message;
    }
  }

  loadContent();
</script>
</body>
</html>
