
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jasur Wiki — Admin</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
    }
    main { max-width: 600px; margin: 30px auto; }
    h1 { color: #ffd600; }
    input, textarea, select, button {
      display: block;
      width: 100%;
      padding: 13px;
      margin: 10px 0;
      border-radius: 8px;
      font-size: 16px;
    }
    input, textarea, select {
      background: #222;
      color: white;
      border: 1px solid #555;
    }
    button {
      border: 0;
      background: #ffd600;
      color: #111;
      font-weight: bold;
    }
    #panel { display: none; }
    #status { overflow-wrap: anywhere; line-height: 1.5; }
  </style>
</head>
<body>
<main>
  <h1>Jasur Wiki Admin</h1>

  <section id="login">
    <input id="email" type="email" placeholder="Admin email">
    <input id="password" type="password" placeholder="Parol">
    <button id="loginBtn">Kirish</button>
  </section>

  <section id="panel" style="display:none">
    <h2>Kontent qo‘shish</h2>

    <label for="section">Bo‘lim</label>
    <select id="section">
      <option value="bio">Bio</option>
      <option value="yutuqlar">Yutuqlar</option>
      <option value="loyihalar">Loyihalar</option>
      <option value="yangiliklar">Yangiliklar</option>
    </select>

    <input id="title" placeholder="Sarlavha">
    <textarea id="content" rows="5" placeholder="Matn"></textarea>
    <input id="image" type="url" placeholder="Rasm URL (ixtiyoriy)">
    <button id="saveBtn">Saqlash</button>
    <button id="logoutBtn">Chiqish</button>
  </section>

  <p id="status" role="status">Yuklanmoqda...</p>
</main>

<script type="module">
import { createClient } from
  'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://nbbpengewjhbvcburydh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_kqXaCVM316G1CppA6_W0JQ_KHWpwrXm';
const ADMIN_ID = '8903470d-e2d2-470b-9e92-50cfa8fc5775';

const $ = id => document.getElementById(id);
const status = message => { $('status').textContent = message; };

let supabase;

function showLogin() {
  $('login').style.display = 'block';
  $('panel').style.display = 'none';
}

function showPanel() {
  $('login').style.display = 'none';
  $('panel').style.display = 'block';
}

async function checkUser() {
  const { data, error } = await supabase.auth.getUser();

  if (error || !data.user) {
    showLogin();
    return false;
  }

  if (data.user.id !== ADMIN_ID) {
    await supabase.auth.signOut();
    showLogin();
    status('Bu akkaunt administrator emas.');
    return false;
  }

  showPanel();
  return true;
}

$('loginBtn').addEventListener('click', async () => {
  const button = $('loginBtn');
  const email = $('email').value.trim();
  const password = $('password').value;

  if (!email || !password) {
    status('Email va parolni kiriting.');
    return;
  }

  button.disabled = true;
  status('Kirilmoqda...');

  try {
    const { data, error } = await supabase.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      status('Kirish xatosi: ' + error.message);
      return;
    }

    if (!data.user || data.user.id !== ADMIN_ID) {
      await supabase.auth.signOut();
      showLogin();
      status('Bu akkaunt administrator sifatida ruxsat olmagan.');
      return;
    }

    showPanel();
    status('Muvaffaqiyatli kirdingiz!');
  } catch (error) {
    status('Xatolik: ' + error.message);
  } finally {
    button.disabled = false;
  }
});

$('saveBtn').addEventListener('click', async () => {
  const button = $('saveBtn');
  const title = $('title').value.trim();
  const content = $('content').value.trim();
  const image_url = $('image').value.trim();

  if (!title || !content) {
    status('Sarlavha va matnni kiriting.');
    return;
  }

  if (image_url) {
    try {
      if (new URL(image_url).protocol !== 'https:') {
        status('Rasm havolasi https:// bilan boshlansin.');
        return;
      }
    } catch {
      status('Rasm URL noto‘g‘ri.');
      return;
    }
  }

  button.disabled = true;
  status('Saqlanmoqda...');

  try {
    if (!await checkUser()) return;

    const { error } = await supabase.from('wiki_content').insert({
      section: $('section').value,
      title,
      content,
      image_url
    });

    if (error) {
      status('Saqlash xatosi: ' + error.message);
      return;
    }

    $('title').value = '';
    $('content').value = '';
    $('image').value = '';
    status('Kontent muvaffaqiyatli saqlandi!');
  } catch (error) {
    status('Xatolik: ' + error.message);
  } finally {
    button.disabled = false;
  }
});

$('logoutBtn').addEventListener('click', async () => {
  const { error } = await supabase.auth.signOut();
  showLogin();
  status(error ? error.message : 'Tizimdan chiqdingiz.');
});

async function start() {
  try {
    supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    const loggedIn = await checkUser();
    if (loggedIn) status('Admin panel tayyor.');
    else status('Email va parol bilan kiring.');
  } catch (error) {
    status('Ulanish xatosi: ' + error.message);
  }
}

start();
</script>
</body>
</html>
